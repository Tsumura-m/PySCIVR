[project]
name = "pyscivr"
version = "0.1.0"
description = "Semiclassical initial value representation in curvilinear coordinates"
readme = "README.md"
authors = [
    { name = "Masaya Tsumura"}
]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "jax",
]

[project.optional-dependencies]
mace = [
    "ase",
    "torch",
    "mace-torch",
]
cuda = [
    "jax[cuda12]",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
]
docs = [
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-rtd-theme>=3.1.0",
]

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"
